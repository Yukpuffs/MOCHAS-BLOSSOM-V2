<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MOCHA'S BLOSSOM </title>
    <link rel="icon" type="favicon" href="../img/icon/Mocha_s_blossom-removebg-preview.ico"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=League+Spartan:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>


<form id="formularioinicio">
    <div class="container-fluid row ">
        <div class="container-fluid inicio col-lg-6 col-md-6 col-sm-6 text-center align-content-center" id="card-present">
            <div class="iniciocont">
                <img  class="mc" src="../img/logo/Mocha_s_blossom-removebg-preview.png" alt="Logo" width="100px"> 
                <h1 class="fontt-text mt-5"> “할수있다! </h1> <br>
                <h1>¡PUEDES HACERLO! </h1>
                <img class="pst mt-5" src="../img/decoraciones/chess.png" alt="brownie" >
            </div>
        </div>
        <div class="login-container col-lg-6 col-md-6 col-sm-6 p-sm-5 text-center align-content-center" id="caja_inicio">
            <div class="soft-card  justify-content-center align-content-center text-center">
                <div class="comfort-header">
                    <h1 class="comfort-title"> Iniciar Sesión </h1>
                    <p class="gentle-subtitle"> 인생은 케이크 같아요 <br> La vida es como un pastel. </p>
                </div>
                
                <form class="comfort-form" id="loginForm" novalidate>
                    <div class="soft-field">
                        <div class="field-container">
                            <input type="email" id="email" name="email" required autocomplete="email" >
                            <label for="email"> Email </label>
                            
                        </div>
                        <span class="gentle-error" id="emailError"></span>
                    </div>
                    <div class="soft-field ">
                        <div class="field-container">
                            <input type="password" id="password" name="passwordd" required autocomplete="current-password">
                            <label for="passwordd">Contraseña</label>
                            </button>
                        </div>
                        <div>
                            <a href="#" class="comfort-link">Forgot password?</a>
                        </div>
                        <button type="submit" class="comfort-button" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            <span class="button-text">Sign in</span>
                        </button>
                        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog prueba" >
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="exampleModalLabel">Aviso de ingreso</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body" id="body">
                                        Ingreso de inicio correcto
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn" data-bs-dismiss="modal">Close</button>
                                        <button type="button" class="btn">
                                            <a href="menu.html">Ir al menu</a>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <div class="comfort-signup">
                    <span class="signup-text">Don't have an account?</span>
                    <a href="registrarse.html" class="comfort-link signup-link">Sign up</a>    
                </div>
            </div>
        </div>    
    </div>      
</form>
</body>
<script src="../script/include.js"></script>
<script src="../script/main.js"></script>
<script src="../script/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
