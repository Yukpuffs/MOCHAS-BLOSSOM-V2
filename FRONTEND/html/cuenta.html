<form id="usuario">
    <div class="container-fluid m-4" id="form">
        <div class="row">
            <div class="justify-content-start col-lg-3 col-md-3 col-sm-12 text-center">
                <img src="../Img/usuario/capi.png" class="img-fluid" alt="..." width="100px">
            </div>
            <div class="justify-content-start col-lg-1 col-md-1 col-sm-12 text-center">
                <p id="user_name">User name <button class="bg-transparent border-0   rounded" id="botoni">
                        <img src="../Img/botones/edit.png" width="20px">
                    </button></p>
                <p><strong>ID USER ######</strong></p>
            </div>
            <div class="justify-content-center col-lg-4 col-md-3 col-sm-12 text-center">
                <a href="listadeseos.html" class="text-white text-decoration-none"><img src="../Img/botones/cora.png" alt="" width="30vh"></a>
                <p>Lista de deseos </p>
            </div>
            <div class="justify-content-center col-lg-4 col-md-3 col-sm-12 text-center">               
                <a href="carritoo.html" class="text-white text-decoration-none"><img src="../Img/botones/shop.png" alt="" width="30vh"></a>
                <p>Mi carrito</p>
            </div>
        </div>
        <div class="row" id="usuarioo">
            <div class="col-lg-6 col-md-6 col-sm-12 mt-4">
                <h1 class="fs-5">Datos Personales 
                    <button class="bg-transparent border-0 rounded" id="boton-aper">
                        <img src="../Img/botones/edit.png" width="20px">
                    </button></h1>
                <div class="m-4">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="entrada inp_pedi" required disabled>
                </div>
                <div class="m-4">
                    <label for="corre_E">Correo Electronico</label>
                    <input type="email" name="corre_E" id="corre_E" class="entrada inp_pedi" required autocomplete="email" disabled>
                </div>
                <div class="m-4">
                    <label for="telefono">Telefono</label>
                    <input type="text" name="telefono" id="telefono" class="entrada inp_pedi" required disabled>
                </div>

            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 mt-4">
                <div class="m-4">
                    <label for="direccion">Direccion</label>
                    <input type="text" name="direccion" id="direccion" class="entrada inp_pedi" required disabled>
                </div>
                <div class="m-4">
                    <label for="tarj">Numero Tarjeta</label>
                    <input type="text" name="num_tarj" id="tarj" class="entrada inp_pedi" required disabled maxlength="10">
                </div>

                <button type="submit" class="btn btns bts text-white"> guardar cambios </button>

            </div>
        </div>    
    </div>
</form>
