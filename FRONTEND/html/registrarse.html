<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MOCHA'S BLOSSOM </title>
    <link rel="icon" type="favicon" href="../img/icon/Mocha_s_blossom-removebg-preview.ico"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=League+Spartan:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>


<form id="regis">
    <div class="container-fluid">
        <div class="row">
            <div class="login-container col-12 col-lg-6 col-md-12 col-sm-12 text-center" id="caja_regis" >
                    <div class="soft-card">
                        <div class="comfort-header">
                            <div>     
                                <h1 class="comfort-title"> Registrarse </h1>
                                <p class="gentle-subtitle"> 행복한 하루 되세요 <br> ¡Que tengas un día feliz!. </p>              
                            </div>
                        </div>
                        
                            <div class="soft-field">
                                <div class="field-container">
                                    <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
                                    <label for="usuario"> Usuario </label>
                                </div>
                            </div>

                            <div class="soft-field">
                                <div class="field-container">
                                    <input type="email" id="emaill" name="email" required autocomplete="email" placeholder="Email">
                                    <label for="email"> Email </label>
                                    
                                </div>
                            </div>

                            <div class="soft-field">
                                <div class="field-container">
                                    <input type="password" id="passwordd" name="passwordd" required autocomplete="current-password" placeholder="Contraseña">
                                    <label for="passwordd">Contraseña</label>
                                </div>
                                <button type="submit" class="comfort-button" data-bs-toggle="modal" data-bs-target="#exampleModal">
                                        <span class="button-text">Sign up</span>
                                </button>
                            </div>
                            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="exampleModalLabel">Aviso de ingreso</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Creo sesion correctamente
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn" data-bs-dismiss="modal">Close</button>
                                            <button type="button" class="btn">
                                                <a href="inisesi.html">Ir a iniciar sesion</a>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>    
                            <div class="comfort-signup">
                                <span class="signup-text">Have an account?</span>
                                <a href="inisesi.html" class="comfort-link signup-link">Sign in</a>    
                            </div>
                        </div>
                    </div>    


            <div class="inicio col-lg-6 col-md-12 col-sm-12 text-center align-content-center" id="card-present_regis">
                <div class="iniciocont regiss">
                    <img src="../img/logo/Mocha_s_blossom-removebg-preview.png" alt="Logo" class="mc" width="100px" > 
                    <h1 class="fontt-text"> “할수있다! </h1> <br>
                    <h1 class="pd">¡PUEDES HACERLO! </h1>
                    <img src="../img/decoraciones/Screenshot_2025-09-13_194328-removebg-preview.png" alt="brownie" class="brr">
                </div>
            </div>   
        </div>       
    </div>   
</form>






</body>
<script src="../script/include.js"></script>
<script src="../script/main.js"></script>
<script src="../script/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
